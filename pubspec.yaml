name: saturne_pro_core
description: "A package that encapsulates the design system and all the shared UI-code for Saturne Pro apps"
version: 0.0.1

environment:
  sdk: ^3.7.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  gap: ^3.0.1
  smooth_page_indicator: ^1.2.1
  tap_builder: ^0.5.0
  dotted_border: ^3.0.1
  pinput: ^5.0.1
  calendar_date_picker2: ^2.0.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: FunnelDisplay
      fonts:
        - asset: assets/fonts/FunnelDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/FunnelDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/FunnelDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/FunnelDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/FunnelDisplay-Light.ttf
          weight: 300

    - family: SaturneProIcons
      fonts:
        - asset: assets/fonts/SaturneProIcons.ttf
